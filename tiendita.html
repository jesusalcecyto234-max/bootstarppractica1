<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>PRACTICAS JAVASCRIPT</title>
</head>
<body>

    <nav class="navbar bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="img/cecy.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">TIENDITA
            </a>
        </div>
    </nav>

    <div class="d-flex">

        <div class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark" style="width: 260px;">
           <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none"></a>
           <hr class="text-white">
           <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item mb-2">
              <a href="tiendita.html" class="nav-link text-white active">
                 PRODUCTOS
              </a>
            </li>
            <li class="nav-item mb-2">
              <a href="categorias.html" class="nav-link text-white">
                 CATEGORÍAS
              </a>
            </li>
           </ul>
        </div>

        <div class="container p-4 bg-inverse mt-5 card">
            <h1 class="text-center fg-black">TIENDITA</h1><hr>
            <div class="d-flex justify-content-end">
                <button type="button" class="btn-solid btn-styled theme-primary w-25" onclick="document.getElementById('addProducto').showModal()"><i class="bi bi-person-plus"></i>Agregar</button>
            </div>
            <table class="table table-striped table-hover mt-3">
                <tr>
                    <td>PRODUCTO</td>
                    <td>PRECIO</td>
                    <td>CANTIDAD</td>
                    <td>CATEGORIA</td>
                    <td>IMAGEN</td>
                    <td>ACTION</td>
                </tr>
                <tbody id="productos"></tbody>
               <tr>
        <td colspan="1" class="text-end"><b>TOTAL PRECIOS:</b></td>
        <td><b><span id="totalPrecio"></span></b></td>
         <td colspan="1" class="text-end"><b>TOTAL CANTIDAD:</b></td>
        <td><b><span id="totalCantidad"></span></b></td>
        <td colspan="3"></td>
    </tr>

  
    <tr>
        <td colspan="1"><b>TOTAL PRECIO POR PRODUCTO</b></td>
        <td><b><span id="totalPrecioProducto"></span></b></td>
        <td colspan="4"></td>
    </tr>
            </table>
        </div>

        <dialog class="dialog" id="addProducto">
          <div class="dialog-header">
            <h1 class="dialog-title">AGREGAR PRODUCTO</h1>
            <button type="button" class="btn-close" onclick="document.getElementById('addProducto').close()" aria-label="Close"></button>
          </div>
          <div class="dialog-body">
            <h3>NOMBRE</h3>
            <input type="text" id="nombre" class="form-control"><br>
            <h3>PRECIO</h3>
            <input type="text" id="precio" class="form-control"><br>
            <h3>CANTIDAD</h3>
            <input type="text" id="cantidad" class="form-control"><br>
            <h3>CATEGORIA</h3>
            <select id="categoria" class="form-control">
                <option value="">Seleccione una categoría</option>
            </select><br>
            <h3>IMAGEN</h3>
            <input type="file" id="imageFileAdd" class="form-control" accept="image/*" onchange="convertirBase64(event, 'imagen')"><br>
            <input type="hidden" id="imagen" class="form-control">
          </div>
          <div class="dialog-footer">
            <button type="button" class="btn-solid theme-danger" onclick="document.getElementById('addProducto').close()"><i class="bi bi-x-circle"></i>Cancelar</button>
            <button type="button" class="btn-solid theme-success" id="btnSave"><i class="bi bi-floppy-fill"></i>Guardar</button>
          </div>
        </dialog>

        <dialog class="dialog" id="editProducto">
          <div class="dialog-header">
            <h1 class="dialog-title">EDITAR PRODUCTO</h1>
            <button type="button" class="btn-close" onclick="document.getElementById('editProducto').close()" aria-label="Close"></button>
          </div>
          <div class="dialog-body">
            <h3>NOMBRE</h3>
            <input type="text" id="nombree" class="form-control"><br>
            <h3>PRECIO</h3>
            <input type="text" id="precioe" class="form-control"><br>
            <h3>CANTIDAD</h3>
            <input type="text" id="cantidade" class="form-control"><br>
            <h3>CATEGORIA</h3>
            <select id="categoriae" class="form-control">
                <option value="">Seleccione una categoría</option>
            </select><br>
            <h3>IMAGEN</h3>
            <input type="file" id="imageFile" class="form-control" accept="image/*" onchange="convertirBase64(event, 'image')"><br>
            <input type="hidden" id="image" class="form-control">
          </div>
          <div class="dialog-footer">
            <input type="hidden" id="posicion">
            <button type="button" class="btn-solid theme-danger" onclick="document.getElementById('editProducto').close()"><i class="bi bi-x-circle"></i>Cancelar</button>
            <button type="button" class="btn-solid theme-success" id="btnEdit"><i class="bi bi-floppy-fill"></i>Actualizar</button>
          </div>
        </dialog>

    </div>

    <script type="module" src="js/bootstrap.bundle.min.js"></script>
    <script src="js/sweetalert2.all.min.js"></script>
    <script src="js/tiendita.js"></script>
</body>
</html>
