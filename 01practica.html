<script>
        function mensaje8(){
           const swalWithBootstrapButtons = Swal.mixin({
  customClass: {
    confirmButton: "btn btn-success",
    cancelButton: "btn btn-danger"
  },
  buttonsStyling: false
});
swalWithBootstrapButtons.fire({
  title: "quieres eliminar a un perro?",
  text: "seguro!",
  icon: "warning",
  showCancelButton: true,
  confirmButtonText: "Yes, eliminalo",
  cancelButtonText: "No, espera",
  reverseButtons: true
}).then((result) => {
  if (result.isConfirmed) swalWithBootstrapButtons.fire({
    title: "ELIMINADO!",
    text: "Tu has eliminado al perro",
    icon: "success"
  });
  else if (result.dismiss === Swal.DismissReason.cancel)
 /* Read more about handling dismissals below */
  swalWithBootstrapButtons.fire({
    title: "NO ELIMINADO",
    text: "TU SALVASTE AL PERRO :)",
    icon: "error"
  });
});
        }
        
    </script>

<script>
        function mensaje6(){
         let timerInterval;
Swal.fire({
  title: "PANTALLA HTML!",
  html: "ESTA PANTALLA SE AUTODESTRUIRA EN <b></b> ",
  timer: 2000,
  timerProgressBar: true,
  didOpen: () => {
    Swal.showLoading();
    const timer = Swal.getPopup().querySelector("b");
    timerInterval = setInterval(() => {
      timer.textContent = `${Swal.getTimerLeft()}`;
    }, 100);
  },
  willClose: () => {
    clearInterval(timerInterval);
  }
}).then((result) => {
  /* Read more about handling dismissals below */
  if (result.dismiss === Swal.DismissReason.timer) console.log("I was closed by the timer");
});
        }
        
    </script>
