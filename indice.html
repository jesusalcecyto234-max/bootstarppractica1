<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="css/indice.css">
</head>
<body>

    <div class="container p-4 bg-info mt-5 card">
        <h2><i class="bi bi-apple"></i>Calculadora de IMC</h2>
        
        <div class="campo">
            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" placeholder="Ej. 70">
        </div>

        <div class="campo">
            <label for="altura">Altura (cm):</label>
            <input type="number" id="altura" placeholder="Ej. 170">
        </div>

        <button onclick="calcular()">Calcular IMC</button>

        <div class="resultado">
            <p id="imc">Su IMC es: -</p>
            <p id="categoria">Su categoria es: -</p>
        </div>
    </div>
    <button class="btn-solid theme-warning mt-3 w-100" id="btnSigno">RESET</button>

    <img src="img/indice.png" alt="">

    <script src="masaapp.js"></script>
</body>
</html>
